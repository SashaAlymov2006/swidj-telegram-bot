name: Offline tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  visual-editor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Verify editor flows, state and navigation
        run: deno test --no-config --allow-read=music_video,miniapp/app.js music_video/tests/state_test.js music_video/tests/editor_flow_test.js music_video/tests/navigation_test.js music_video/tests/timing_test.js music_video/tests/animation_test.js music_video/tests/player_lyrics_test.js tests/worklet_test.js tests/queue_ui_test.js tests/release_ui_test.js tests/navigation_ui_test.js
      - name: Verify recording selection and source filtering
        run: deno run --no-config --allow-read=miniapp/app.js tests/verify_source_choices.mjs
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build runtime
        run: docker build -t swidj:ci .
      - name: Run offline tests
        run: docker run --rm --network none --mount type=bind,source="${{ github.workspace }}",target=/workspace,readonly --workdir /workspace swidj:ci python -m unittest discover -s tests -v
      - name: Check dependencies
        run: docker run --rm --network none swidj:ci python -m pip check
  visual-studio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated video renderer
        run: docker build -f music_video/Dockerfile -t swidj:visual-ci .
      - name: Verify renderer, ownership, cancellation and recovery
        run: >-
          docker run --rm --network none --cpus 1 --memory 2g
          --pids-limit 64 --read-only --tmpfs /tmp:rw,size=2g,mode=1777
          --mount type=bind,source="${{ github.workspace }}/music_video/tests",target=/app/music_video/tests,readonly
          --entrypoint python swidj:visual-ci -m unittest discover -s music_video/tests -q
