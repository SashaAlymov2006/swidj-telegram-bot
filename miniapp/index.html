<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101116">
  <title>SwiDJ — Your music, your way</title>
  <link rel="stylesheet" href="/assets/app.css">
  <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
  <script src="/assets/app.js" type="module"></script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="#home" aria-label="SwiDJ home"><span class="brand-mark">s<span>♪</span></span>SwiDJ<span class="brand-dot">●</span></a>
      <p class="rail-caption" data-i18n="yourSpace"></p>
      <nav id="desktop-nav" aria-label="Main navigation"></nav>
      <div class="rail-bottom"><div class="rail-art" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><strong data-i18n="makeItYours"></strong><p data-i18n="railNote"></p><button class="text-btn" data-go="studio" data-i18n="openStudio"></button></div>
    </aside>
    <div class="workspace">
      <header class="topbar"><a class="mobile-brand" href="#home">SwiDJ<span>●</span></a><span class="top-label" data-i18n="musicSpace"></span><div class="top-actions"><span id="connection" class="connection"></span><button id="language" class="language" aria-label="Change language">EN</button><span class="avatar" id="avatar" aria-hidden="true">S</span></div></header>
      <main id="content" tabindex="-1"></main>
      <footer class="page-footer"><span>SwiDJ</span><span data-i18n="footer"></span></footer>
    </div>
  </div>
  <div id="activity" class="activity" hidden role="status" aria-live="polite"><span class="activity-spinner"></span><div><strong id="activity-title"></strong><span id="activity-label"></span></div><button id="cancel-prepare" class="text-btn"></button></div>
  <section class="player" aria-label="Audio player">
    <div class="now-playing"><button id="player-art" class="mini-art art-0" aria-label="Now playing"><span>♪</span></button><button class="now-copy plain" id="open-player" aria-label="Now playing"><strong id="now-title"></strong><span id="now-artist"></span></button><button id="player-like" class="icon-btn" aria-label="Favorite" aria-pressed="false"></button></div>
    <div class="transport"><div class="transport-buttons"><button id="previous" class="icon-btn" aria-label="Previous track"></button><button id="play" class="play-main" aria-label="Play"></button><button id="next" class="icon-btn" aria-label="Next track"></button><button type="button" id="open-queue" class="icon-btn" aria-label="Queue">&#9776;</button><button id="repeat" class="icon-btn repeat" aria-label="Repeat" aria-pressed="false"></button></div><div class="timeline"><span id="elapsed">0:00</span><input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek"><span id="duration">0:00</span></div></div>
    <div class="player-extra"><span id="volume-icon"></span><input id="volume" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Volume"><button class="icon-btn" id="expand-studio" aria-label="Open studio"></button></div>
  </section>
  <nav id="mobile-nav" class="mobile-nav" aria-label="Main navigation"></nav>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="dialog"><form method="dialog" id="dialog-form"><div class="dialog-head"><h2 id="dialog-title"></h2><button class="icon-btn" value="cancel" aria-label="Close">✕</button></div><div id="dialog-body"></div><div class="dialog-actions" id="dialog-actions"></div></form></dialog>
  <audio id="audio" preload="metadata"></audio>
</body>
</html>
